<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Testimonial Block Demo</title>
    <link rel="stylesheet" href="/styles/fonts.css">
    <link rel="stylesheet" href="/blocks/testimonial/testimonial.css">
    <style>
      body {
        margin: 0;
        padding: 72px 24px;
        background-color: #f7faf9;
        background-image: linear-gradient(#dceee9 1px, transparent 1px), linear-gradient(90deg, #dceee9 1px, transparent 1px);
        background-size: 32px 32px;
        color: #163238;
        font-family: roboto, sans-serif;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
      }

      .section-kicker {
        margin: 0 0 12px;
        color: #ef8354;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 620px;
        margin: 0 0 40px;
        font-family: roboto-condensed, sans-serif;
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        line-height: 0.98;
      }

      .section-intro {
        max-width: 520px;
        margin: -24px 0 40px;
        color: #49656a;
        font-size: 1.05rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="section-kicker">Field notes</p>
      <h1>Good work sounds better when it is shared.</h1>
      <p class="section-intro">A few words from the people building thoughtful products, teams, and momentum every day.</p>
      <div class="testimonial block"></div>
    </main>
    <script type="module">
      import decorate from '/blocks/testimonial/testimonial.js';

      decorate(document.querySelector('.testimonial'));
    </script>
  </body>
</html>
